name: Import Mokai collateral assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-mokai-collateral.yml"
      - "scripts/import_mokai_collateral.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-collateral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset tooling
        run: python -m pip install --disable-pip-version-check gdown==5.2.0 Pillow==11.3.0

      - name: Import and optimize collateral assets
        run: python scripts/import_mokai_collateral.py

      - name: Validate collateral asset set
        run: |
          test -f public/images/brand/collateral/bottom-cup-sticker-mockup.webp
          test -f public/images/brand/collateral/takeaway-bag-mockup.webp
          test -f public/images/brand/collateral/dessert-box-artwork.webp

      - name: Commit collateral assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSET-MANIFEST.md public/assets/mokai-assets.json public/images/brand/collateral
          if git diff --cached --quiet; then
            echo "No collateral changes to commit."
            exit 0
          fi
          git commit -m "Add frontend-ready Mokai collateral assets"
          git push origin HEAD:main
